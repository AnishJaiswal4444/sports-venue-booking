# Application Name
spring.application.name=sports-venue-booking

# Server Configuration
server.port=8080

# Database Configuration (Environment variables for Docker, defaults for local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/venue_booking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

# Sports API Configuration
sports.api.url=${SPORTS_API_URL:https://stapubox.com/sportslist/}

# Logging
logging.level.root=INFO
logging.level.com.venue.sports_venue_booking=DEBUG

#dockerignore
