# Application Name
spring.application.name=sports-venue-booking

# Server Port
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/venue_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.venue.booking=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Jackson Configuration (JSON)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# External Sports API
sports.api.url=https://stapubox.com/sportslist/